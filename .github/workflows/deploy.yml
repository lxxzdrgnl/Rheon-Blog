name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/lxxzdrgnl/rheon-blog:latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/blog/data

            cat > ~/blog/.env.production << 'ENVEOF'
            ADMIN_ID=${{ secrets.ADMIN_ID }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            MINIO_ENDPOINT=host.docker.internal
            MINIO_PORT=9000
            MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
            MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
            MINIO_BUCKET=blog
            MINIO_USE_SSL=false
            MINIO_PUBLIC_URL=https://storage.rheon.kr
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            DATABASE_PATH=./data/blog.db
            MCP_TOKEN=${{ secrets.MCP_TOKEN }}
            DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
            ENVEOF

            cat > ~/blog/docker-compose.prod.yml << 'COMPEOF'
            services:
              app:
                image: ghcr.io/lxxzdrgnl/rheon-blog:latest
                ports:
                  - "3200:3000"
                volumes:
                  - ./data:/app/data
                env_file: .env.production
                extra_hosts:
                  - "host.docker.internal:host-gateway"
                restart: unless-stopped
            COMPEOF

            docker pull ghcr.io/lxxzdrgnl/rheon-blog:latest
            cd ~/blog
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            sleep 10
            curl -sf http://localhost:3200 > /dev/null && echo "Health check passed" || echo "Health check failed (app may still be starting)"
